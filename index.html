<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Araç Sentry Canlı İzleme</title>

    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 15px;
        }
        .header {
            text-align: center;
            padding: 12px;
            background: #1a1a1a;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        .system-status { font-size: 16px; font-weight: bold; color: #00e676; }
        .last-update { font-size: 11px; color: #888; margin-top: 4px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex: 1;
        }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border: 2px solid #2a2a2a;
            position: relative;
            overflow: hidden;
        }
        .card.active {
            border-color: #ff5252;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0% { border-color: #ff5252; }
            50% { border-color: #b71c1c; }
            100% { border-color: #ff5252; }
        }
        .card-title { font-size: 12px; color: #aaa; margin-bottom: 4px; font-weight: bold; }
        .video-box {
            width: 100%;
            height: 120px;
            background-color: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 11px;
            object-fit: cover;
        }
        .card-state { font-size: 13px; font-weight: bold; margin-top: 6px; }
        .btn-audio {
            margin-top: 12px;
            padding: 14px;
            background: linear-gradient(135deg, #2979ff, #1565c0);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(41, 121, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="system-status" id="sysStatus">SENTRY CANLI MOD: AKTİF</div>
        <div class="last-update" id="lastUpdate">Son Kontrol: Bağlanıyor...</div>
    </div>

    <div class="grid">
        <!-- Ön Kamera -->
        <div class="card" id="camFront">
            <div class="card-title">ÖN KAMERA</div>
            <img id="streamFront" class="video-box" src="" alt="Sinyal Yok" />
            <div class="card-state">TEMİZ</div>
        </div>
        <!-- Arka Kamera -->
        <div class="card" id="camRear">
            <div class="card-title">ARKA KAMERA</div>
            <img id="streamRear" class="video-box" src="" alt="Sinyal Yok" />
            <div class="card-state">TEMİZ</div>
        </div>
        <!-- Sol Kamera -->
        <div class="card" id="camLeft">
            <div class="card-title">SOL KAMERA</div>
            <img id="streamLeft" class="video-box" src="" alt="Sinyal Yok" />
            <div class="card-state">TEMİZ</div>
        </div>
        <!-- Sağ Kamera -->
        <div class="card" id="camRight">
            <div class="card-title">SAĞ KAMERA</div>
            <img id="streamRight" class="video-box" src="" alt="Sinyal Yok" />
            <div class="card-state">TEMİZ</div>
        </div>
    </div>

    <button class="btn-audio" onclick="enableAudio()">SENTRY SESLİ UYARIYI BAŞLAT</button>

    <script>
        // Sizin Firebase Proje Bağlantınız
        const firebaseConfig = {
            databaseURL: "https://karsilama-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref("sentry_system");

        let audioAllowed = false;
        let lastState = { front: false, rear: false, left: false, right: false };

        function speak(text) {
            if (!audioAllowed) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            window.speechSynthesis.speak(utterance);
        }

        function enableAudio() {
            audioAllowed = true;
            speak("Sentry güvenlik sistemi aktif. Araç izleniyor.");
            document.querySelector('.btn-audio').style.display = 'none';
        }

        function updateCard(id, streamImgId, state, streamUrl) {
            const el = document.getElementById(id);
            const stateEl = el.querySelector('.card-state');
            const imgEl = document.getElementById(streamImgId);
            
            if (streamUrl && imgEl.src !== streamUrl) {
                imgEl.src = streamUrl;
            }

            if (state) {
                el.classList.add('active');
                stateEl.innerText = "HAREKET!";
                stateEl.style.color = "#ff5252";
            } else {
                el.classList.remove('active');
                stateEl.innerText = "TEMİZ";
                stateEl.style.color = "#00e676";
            }
        }

        dbRef.on('value', (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                
                const front = data.front_motion || false;
                const rear = data.rear_motion || false;
                const left = data.left_motion || false;
                const right = data.right_motion || false;

                // Kamera Görselleri ve Hareket Durumları
                updateCard('camFront', 'streamFront', front, data.front_url);
                updateCard('camRear', 'streamRear', rear, data.rear_url);
                updateCard('camLeft', 'streamLeft', left, data.left_url);
                updateCard('camRight', 'streamRight', right, data.right_url);

                // Sesli Uyarı İkazları
                if (front && !lastState.front) speak("Uyarı! Aracın önünde hareket algılandı.");
                if (rear && !lastState.rear) speak("Uyarı! Aracın arkasında hareket algılandı.");
                if (left && !lastState.left) speak("Uyarı! Aracın solunda hareket algılandı.");
                if (right && !lastState.right) speak("Uyarı! Aracın sağında hareket algılandı.");

                lastState = { front, rear, left, right };
                document.getElementById('lastUpdate').innerText = "Son Kontrol: " + new Date().toLocaleTimeString();
            }
        });
    </script>
</body>
</html>
